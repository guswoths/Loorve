# ============================================================
# JVM 설정
# ============================================================
# 힙 메모리 4GB 할당, 파일 인코딩 UTF-8 지정
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# ============================================================
# Gradle 빌드 최적화
# ============================================================
# 병렬 빌드 활성화 (멀티모듈에서 효과적)
org.gradle.parallel=true

# 빌드 캐시 활성화 (동일 입력 → 캐시 재사용)
org.gradle.caching=true

# 설정 캐시 활성화 (Gradle 설정 단계 캐싱)
org.gradle.configuration-cache=true

# ============================================================
# Android 설정
# ============================================================
# AndroidX 라이브러리 사용
android.useAndroidX=true

# Jetifier 비활성화: 신규 프로젝트로 레거시 라이브러리 없음
# 레거시 서드파티 라이브러리 추가 시 true로 변경
android.enableJetifier=false

# 모듈별 필요한 R 클래스만 포함 (멀티모듈 빌드 최적화)
android.nonTransitiveRClass=true

# ============================================================
# Kotlin 설정
# ============================================================
kotlin.code.style=official

# ============================================================
# 보안 주의사항 (절대 이 파일에 포함 금지)
# ============================================================
# API 키, 비밀번호, 토큰 등 민감 정보는
# local.properties 또는 CI/CD 환경변수(예: GOOGLE_SERVICES_JSON)로 관리할 것
# local.properties는 반드시 .gitignore에 포함되어야 함
